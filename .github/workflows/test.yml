name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  # The deployment job is gated on main; this is how to run it on a branch.
  workflow_dispatch:

# A push that supersedes an earlier one cancels it: the school does not need to
# pay for CI on a commit nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest

    # The same major version the deployment runs. The tests exercise real SQL
    # against a real Postgres, because what they check - a conditional UPDATE
    # claiming a row, aggregates over jsonb, an index being used - does not
    # exist anywhere else.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foundation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Database tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foundation_test

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # A build failure here is a broken deployment, so it is worth catching
      # before the image is built rather than during `docker compose up`.
      - name: Build
        run: npm run build

  browser:
    name: Browser
    runs-on: ubuntu-latest
    # No point driving a browser at a build that does not compile.
    needs: [server, web]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The run drops and recreates this database itself; see e2e/fixtures/serve.mjs.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foundation_e2e

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # psql, for the drop-and-recreate the run does before starting the API.
      - name: Install the postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install
        run: |
          npm ci --prefix server
          npm ci --prefix web
          npm ci --prefix e2e

      # The browser tests run against the built app and the built API, not
      # against dev servers, so both have to exist first.
      - name: Build
        run: |
          npx --prefix server prisma generate
          npm run build --prefix server
          npm run build --prefix web

      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Browser tests
        run: npm test --prefix e2e

      # Only written when something failed: trace, video and screenshot for
      # each one, which is the difference between "CI is red" and knowing why.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  deployment:
    name: The real stack
    runs-on: ubuntu-latest
    needs: [browser]
    # Builds four images and brings the whole thing up, so it is not run on
    # every push. It is the only job that exercises what a school actually
    # installs: nginx serving the assets, Caddy routing /api, the API and
    # Postgres in their own containers, migrations and seed on first boot.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Configure the deployment
        run: |
          cp .env.example .env
          # PUBLIC_HOST=localhost and plain HTTP: the documented way to try it
          # on a machine with no domain name. See docker-compose.local.yml.
          sed -i 's|^PUBLIC_HOST=.*|PUBLIC_HOST=localhost|' .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -base64 48 | tr -d '\n')|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i 's|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=E2E_Admin_4471|' .env
          # Deliberately not relaxing anything else. One account, one device
          # stays on, which the suite is built to work under: the administrator
          # signs in once and the children get their own browser contexts.

      - name: Bring the stack up
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build

      - name: Wait for it to answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/api/health > /dev/null; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "the stack never became healthy"
          docker compose ps
          docker compose logs --tail=80
          exit 1

      - name: Install the browser
        run: |
          npm ci --prefix e2e
          npx --prefix e2e playwright install --with-deps chromium

      # Against the deployment rather than a preview server, which is what makes
      # the checks in served.spec.ts - the SPA fallback, the cache headers, the
      # compression, the security headers - actually run.
      - name: Browser tests against the deployment
        run: npm test --prefix e2e
        env:
          E2E_BASE_URL: http://localhost

      - name: What the containers said, if it failed
        if: failure()
        run: docker compose logs --tail=200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-stack
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  migrations:
    name: Migrations match the schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foundation_drift
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foundation_drift

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci

      # An upgrade runs `prisma migrate deploy` against a school's live data.
      # If the migrations do not add up to the schema the code expects, that is
      # discovered on their server, mid-term. So: apply every migration to an
      # empty database and check nothing is left over.
      - name: Apply every migration from empty
        run: npx prisma migrate deploy

      - name: No drift between the migrations and schema.prisma
        run: |
          npx prisma migrate diff \
            --from-schema-datamodel prisma/schema.prisma \
            --to-schema-datasource prisma/schema.prisma \
            --exit-code
