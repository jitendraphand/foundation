name: Tests

on:
  push:
    branches: ['**']
  pull_request:

# A push that supersedes an earlier one cancels it: the school does not need to
# pay for CI on a commit nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest

    # The same major version the deployment runs. The tests exercise real SQL
    # against a real Postgres, because what they check - a conditional UPDATE
    # claiming a row, aggregates over jsonb, an index being used - does not
    # exist anywhere else.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foundation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Database tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foundation_test

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # A build failure here is a broken deployment, so it is worth catching
      # before the image is built rather than during `docker compose up`.
      - name: Build
        run: npm run build

  browser:
    name: Browser
    runs-on: ubuntu-latest
    # No point driving a browser at a build that does not compile.
    needs: [server, web]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The run drops and recreates this database itself; see e2e/fixtures/serve.mjs.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foundation_e2e

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # psql, for the drop-and-recreate the run does before starting the API.
      - name: Install the postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install
        run: |
          npm ci --prefix server
          npm ci --prefix web
          npm ci --prefix e2e

      # The browser tests run against the built app and the built API, not
      # against dev servers, so both have to exist first.
      - name: Build
        run: |
          npx --prefix server prisma generate
          npm run build --prefix server
          npm run build --prefix web

      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Browser tests
        run: npm test --prefix e2e

      # Only written when something failed: trace, video and screenshot for
      # each one, which is the difference between "CI is red" and knowing why.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  migrations:
    name: Migrations match the schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foundation_drift
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foundation_drift

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci

      # An upgrade runs `prisma migrate deploy` against a school's live data.
      # If the migrations do not add up to the schema the code expects, that is
      # discovered on their server, mid-term. So: apply every migration to an
      # empty database and check nothing is left over.
      - name: Apply every migration from empty
        run: npx prisma migrate deploy

      - name: No drift between the migrations and schema.prisma
        run: |
          npx prisma migrate diff \
            --from-schema-datamodel prisma/schema.prisma \
            --to-schema-datasource prisma/schema.prisma \
            --exit-code
