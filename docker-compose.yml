services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Postgres ships tuned for a machine far smaller than any it is likely to
    # be run on: 128 MB of cache and 4 MB of working memory, whatever the host
    # has. The defaults below are the same conservative figures, so nothing
    # changes for a 4 GB box; a school with a large machine raises them in .env
    # and gets the machine it paid for. See DEPLOYMENT.md, "Sizing the database".
    command:
      - postgres
      - -c
      - shared_buffers=${DB_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${DB_EFFECTIVE_CACHE:-1GB}
      - -c
      - work_mem=${DB_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${DB_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_connections=${DB_MAX_CONNECTIONS:-100}
      # Nothing here runs on a spinning disk any more, and the planner's
      # defaults still assume one - which is what makes it prefer a sequential
      # scan over an index it should be using.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - checkpoint_completion_target=0.9
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host: only reachable from other compose services.
    expose:
      - "5432"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    # Reported by `docker compose ps`, and what caddy waits for on a cold
    # start. Note that plain Compose does not restart an unhealthy container -
    # restart: unless-stopped covers the process exiting, which is the failure
    # that actually happens.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      # No connection_limit in the URL: the API divides DB_POOL_SIZE between
      # its workers and sets each one's share itself, so the total stays the
      # number configured here however many cores the machine has. Prisma's own
      # default is cpus*2+1, which a whole class starting a paper at once
      # queues behind and then fails with P2024.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&pool_timeout=20
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      # API worker processes. 0 means one per core, capped at 8 - a single Node
      # process uses a single core, so this is what decides whether a large
      # machine is used or merely owned.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-0}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-foundation_123}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-720}
      # Both of these are offered in .env.example and read by the server, so
      # they have to be handed to the container - without these two lines an
      # operator who turned single-device login off, or lengthened the idle
      # timeout, would see the setting quietly ignored. The defaults here match
      # the server's own, so behaviour is unchanged when .env says nothing.
      IDLE_TIMEOUT_MINUTES: ${IDLE_TIMEOUT_MINUTES:-30}
      SINGLE_DEVICE_LOGIN: ${SINGLE_DEVICE_LOGIN:-true}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-180000}
      LLM_MAX_MS: ${LLM_MAX_MS:-900000}
      PUBLIC_HOST: ${PUBLIC_HOST}
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    expose:
      - "4000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  uploads:
  backups:
  caddy_data:
  caddy_config:
