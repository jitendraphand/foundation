services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host: only reachable from other compose services.
    expose:
      - "5432"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    # Reported by `docker compose ps`, and what caddy waits for on a cold
    # start. Note that plain Compose does not restart an unhealthy container -
    # restart: unless-stopped covers the process exiting, which is the failure
    # that actually happens.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      # connection_limit is set explicitly because Prisma's default is
      # cpus*2+1 - five on a 2-core box - and a whole class starting a paper at
      # once queues behind it, then fails with P2024 after the pool timeout.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=${DB_POOL_SIZE:-20}&pool_timeout=20
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-foundation_123}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-720}
      # Both of these are offered in .env.example and read by the server, so
      # they have to be handed to the container - without these two lines an
      # operator who turned single-device login off, or lengthened the idle
      # timeout, would see the setting quietly ignored. The defaults here match
      # the server's own, so behaviour is unchanged when .env says nothing.
      IDLE_TIMEOUT_MINUTES: ${IDLE_TIMEOUT_MINUTES:-30}
      SINGLE_DEVICE_LOGIN: ${SINGLE_DEVICE_LOGIN:-true}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-180000}
      PUBLIC_HOST: ${PUBLIC_HOST}
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    expose:
      - "4000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  uploads:
  backups:
  caddy_data:
  caddy_config:
