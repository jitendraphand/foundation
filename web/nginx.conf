server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    # Both spellings of the JavaScript type on purpose. nginx changed the
    # default for .js from application/javascript to text/javascript, so a
    # config listing only one of them silently stops compressing the bundle when
    # the base image is next bumped - and the bundle is by far the largest thing
    # a school's connection has to carry.
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are immutable, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every unknown path serves index.html so that a deep link
    # such as /attempt/<id> works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
