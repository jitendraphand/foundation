# Overrides for trying the system on your own machine, with no domain name and
# no certificate.
#
#   sudo docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Then open http://localhost
#
# Only two things change: Caddy serves plain HTTP instead of HTTPS, and the
# session cookie is not marked Secure - a browser refuses to store a Secure
# cookie from http://192.168.x.x, so without this nobody could sign in from
# another device on the same Wi-Fi.
#
# Everything else - the API, the database, the migrations, the seed, the whole
# frontend - is byte-for-byte what runs on the server.
services:
  api:
    environment:
      COOKIE_SECURE: "false"

  caddy:
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro

  # Same reason as COOKIE_SECURE above, one layer down: n8n marks its own
  # login cookie Secure by default, and a browser will not send a Secure
  # cookie over http://n8n.localhost, so the editor would refuse its own
  # sign-in page. The production stack stays on HTTPS and keeps the default.
  n8n:
    environment:
      N8N_SECURE_COOKIE: "false"
